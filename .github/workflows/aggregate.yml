name: aggregate

# Phase-B aggregation pipeline (honua-io/honua-evidence#1, #3). Pulls
# producer snapshots, writes the enriched capability-matrix.v1.json, commits
# it to trunk if it changed, builds the static evidence site, and deploys it
# to GitHub Pages.
#
# Cross-repo reads (honua-server issue lookup, honua-server/SDK commit
# metadata, honua-samples Actions artifact download) need a token with read
# access to those repos -- the default GITHUB_TOKEN is scoped to this repo
# only. Set repo secret HONUA_EVIDENCE_TOKEN to a fine-grained PAT with
# read-only "Issues" + "Contents" + "Actions" access on honua-server,
# honua-sdk-js, honua-sdk-dotnet, honua-sdk-python, and honua-samples. If the
# secret is absent, aggregate.py still runs -- the producers that need it
# degrade to an honest "missing" freshness entry rather than failing the
# build (see scripts/aggregate.py's fetch_samples / fetch_open_issues).
#
# No `on: push` trigger here by design: this job commits directly to trunk,
# and a push trigger on the same branch would re-run itself in a loop.
#
# ---------------------------------------------------------------------------
# WHY THIS IS TWO JOBS AND TWO CONCURRENCY GROUPS (honua-io/honua-evidence#17)
#
# It used to be ONE job (`aggregate-and-deploy`) that both regenerated the
# ledger and deployed Pages, bound to the `github-pages` environment, under a
# single WORKFLOW-level `concurrency: {group: aggregate-pages,
# cancel-in-progress: false}`.
#
# On 2026-08-16 the scheduled run parked in `waiting` on that environment with
# `reviewers: []` -- no eligible approver at all, so nothing could ever release
# it. Because the environment gate is evaluated before the job starts, and
# because the workflow-level group refused to cancel in progress, that one
# unapprovable run held `aggregate-pages` for 42 hours: 10 consecutive later
# runs queued behind it and were cancelled, and data/capability-matrix.v1.json
# froze at 2026-08-16T05:45:56Z while honua-release's gate-evidence stayed
# green off the frozen timestamps.
#
# The structural fix is that THE LEDGER NO LONGER DEPENDS ON THE ENVIRONMENT.
#   * `aggregate` carries no `environment:`, so it can never be parked waiting
#     for an approval that may not be grantable. Its own group serialises the
#     direct-to-trunk push (cancel-in-progress: false -- never drop a refresh
#     that is mid-push), and its members always run to completion or time out.
#   * `deploy` is the only environment-bound job, and its group is
#     cancel-in-progress: TRUE. A parked deploy is superseded by the next run
#     instead of blocking it; Pages is last-writer-wins, so nothing is lost by
#     cancelling an older deploy that a newer one is about to replace.
#
# So the worst case degrades from "the freshness source of truth for the whole
# release gate stops moving" to "the published site lags behind a still-fresh
# committed ledger", and .github/workflows/ledger-liveness.yml says so out
# loud from inside this repo rather than being diagnosed three repos away.
#
# `timeout-minutes` is a backstop here, NOT the fix: GitHub starts a job's
# timeout when the job STARTS RUNNING, so time parked in `waiting` on an
# environment does not count against it (a pending deployment sits for up to
# 30 days). A timeout alone would not have broken the 2026-08-16 deadlock.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "23 6 * * *" # daily
  workflow_dispatch:
    inputs:
      requirements_revision:
        description: "Full honua-release commit SHA containing the governed certification denominator, or trunk"
        required: false
        default: trunk
        type: string
      candidate_source_sha:
        description: "Exact honua-server candidate source SHA; defaults to the governed repository variable"
        required: false
        type: string
      candidate_image_digest:
        description: "Exact candidate image digest; defaults to the governed repository variable"
        required: false
        type: string
      candidate_cut_at:
        description: "Exact frozen candidate cut; defaults to the governed repository variable"
        required: false
        type: string
  repository_dispatch:
    types: [producer-updated]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    # Steady state is ~30s. Generous ceiling so a hung producer fetch dies
    # instead of holding the ledger group.
    timeout-minutes: 20
    # Serialises the direct-to-trunk commit only. Deliberately NOT the same
    # group as the Pages deploy, and deliberately NOT environment-bound.
    concurrency:
      group: aggregate-ledger
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: trunk

      - name: Run aggregation
        env:
          HONUA_EVIDENCE_TOKEN: ${{ secrets.HONUA_EVIDENCE_TOKEN }}
        run: python3 scripts/aggregate.py

      - name: Commit refreshed capability ledger if changed
        id: capability-commit
        run: |
          if git diff --quiet -- data/capability-matrix.v1.json; then
            echo "No change to capability ledger."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -c user.name="honua-evidence-bot" -c user.email="noreply@honua.io" \
              add -- data/capability-matrix.v1.json
            git -c user.name="honua-evidence-bot" -c user.email="noreply@honua.io" \
              commit -m "chore: refresh capability-matrix.v1.json"
            for attempt in 1 2 3; do
              git fetch --quiet origin trunk
              git rebase origin/trunk
              if git push origin HEAD:trunk; then break; fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not publish capability ledger after 3 concurrent-update retries."
                exit 1
              fi
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Aggregate protocol certification observations
        env:
          REQUIREMENTS_REVISION: ${{ inputs.requirements_revision || 'trunk' }}
          INPUT_CANDIDATE_SOURCE_SHA: ${{ inputs.candidate_source_sha }}
          INPUT_CANDIDATE_IMAGE_DIGEST: ${{ inputs.candidate_image_digest }}
          INPUT_CANDIDATE_CUT_AT: ${{ inputs.candidate_cut_at }}
          GOVERNED_CANDIDATE_SOURCE_SHA: ${{ vars.PROTOCOL_CERTIFICATION_CANDIDATE_SOURCE_SHA }}
          GOVERNED_CANDIDATE_IMAGE_DIGEST: ${{ vars.PROTOCOL_CERTIFICATION_CANDIDATE_IMAGE_DIGEST }}
          GOVERNED_CANDIDATE_CUT_AT: ${{ vars.PROTOCOL_CERTIFICATION_CANDIDATE_CUT_AT }}
          HONUA_EVIDENCE_TOKEN: ${{ secrets.HONUA_EVIDENCE_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .aggregate-cache
          if [[ "$REQUIREMENTS_REVISION" == "trunk" ]]; then
            REQUIREMENTS_SHA="$(git ls-remote https://github.com/honua-io/honua-release.git refs/heads/trunk | cut -f1)"
          elif [[ "$REQUIREMENTS_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            REQUIREMENTS_SHA="$REQUIREMENTS_REVISION"
          else
            echo "::error::requirements_revision must be 'trunk' or a full lowercase commit SHA"
            exit 1
          fi
          if [[ ! "$REQUIREMENTS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve an immutable honua-release requirements revision"
            exit 1
          fi
          echo "Using honua-release certification requirements at $REQUIREMENTS_SHA"
          REQUIREMENTS_HTTP_STATUS="$(curl --silent --show-error --location \
            "https://raw.githubusercontent.com/honua-io/honua-release/$REQUIREMENTS_SHA/certification/protocol-certification-requirements.v1.json" \
            --output .aggregate-cache/protocol-certification-requirements.v1.json \
            --write-out '%{http_code}')" || {
              echo "::error::Could not fetch protocol certification requirements."
              exit 1
            }
          if [[ "$REQUIREMENTS_REVISION" == "trunk" && "$REQUIREMENTS_HTTP_STATUS" == "404" ]]; then
            rm -f .aggregate-cache/protocol-certification-requirements.v1.json
            echo "::notice::Protocol certification contract is wired but awaiting its requirements catalog on honua-release trunk."
            exit 0
          fi
          if [[ "$REQUIREMENTS_HTTP_STATUS" != "200" ]]; then
            echo "::error::Protocol certification requirements fetch returned HTTP $REQUIREMENTS_HTTP_STATUS."
            exit 1
          fi
          # The denominator owns the producer pins, so it must be in hand before
          # the harvest: fragments are selected BY revision, never by recency.
          python3 scripts/fetch-certification-producers.py \
            --registry config/protocol-certification-producers.v1.json \
            --requirements .aggregate-cache/protocol-certification-requirements.v1.json \
            --output data/producers/protocol-certification/fetched
          if ! find data/producers/protocol-certification -name '*.json' -print -quit | grep -q .; then
            echo "::notice::Protocol certification contract is wired but awaiting its first producer fragment."
            exit 0
          fi
          manual_candidate_fields=0
          [[ -z "$INPUT_CANDIDATE_SOURCE_SHA" ]] || manual_candidate_fields=$((manual_candidate_fields + 1))
          [[ -z "$INPUT_CANDIDATE_IMAGE_DIGEST" ]] || manual_candidate_fields=$((manual_candidate_fields + 1))
          [[ -z "$INPUT_CANDIDATE_CUT_AT" ]] || manual_candidate_fields=$((manual_candidate_fields + 1))
          if [[ "$manual_candidate_fields" -ne 0 && "$manual_candidate_fields" -ne 3 ]]; then
            echo "::error::Manual candidate override requires source SHA, image digest, and cut together."
            exit 1
          fi
          if [[ "$manual_candidate_fields" -eq 3 ]]; then
            CANDIDATE_SOURCE_SHA="$INPUT_CANDIDATE_SOURCE_SHA"
            CANDIDATE_IMAGE_DIGEST="$INPUT_CANDIDATE_IMAGE_DIGEST"
            CANDIDATE_CUT_AT="$INPUT_CANDIDATE_CUT_AT"
          else
            CANDIDATE_SOURCE_SHA="$GOVERNED_CANDIDATE_SOURCE_SHA"
            CANDIDATE_IMAGE_DIGEST="$GOVERNED_CANDIDATE_IMAGE_DIGEST"
            CANDIDATE_CUT_AT="$GOVERNED_CANDIDATE_CUT_AT"
          fi
          if [[ ! "$CANDIDATE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [[ ! "$CANDIDATE_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             [[ ! "$CANDIDATE_CUT_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]]; then
            echo "::error::A complete immutable governed candidate triple is required."
            exit 1
          fi
          candidate_args=(
            --candidate-source-sha "$CANDIDATE_SOURCE_SHA"
            --candidate-image-digest "$CANDIDATE_IMAGE_DIGEST"
            --candidate-cut-at "$CANDIDATE_CUT_AT"
          )
          python3 scripts/aggregate-certification.py \
            --requirements .aggregate-cache/protocol-certification-requirements.v1.json \
            --requirements-source-revision "$REQUIREMENTS_SHA" \
            "${candidate_args[@]}"

      - name: Commit refreshed protocol certification ledger if changed
        id: certification-commit
        run: |
          if [ -z "$(git status --porcelain -- data/protocol-certification.v1.json data/protocol-certification-summary.v1.json data/sha256/)" ]; then
            echo "No change to protocol certification ledger."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git -c user.name="honua-evidence-bot" -c user.email="noreply@honua.io" \
              add -- data/protocol-certification.v1.json data/protocol-certification-summary.v1.json
            if [ -d data/sha256 ]; then
              git -c user.name="honua-evidence-bot" -c user.email="noreply@honua.io" add -- data/sha256/
            fi
            git -c user.name="honua-evidence-bot" -c user.email="noreply@honua.io" \
              commit -m "chore: refresh protocol-certification.v1.json"
            # The capability ledger is intentionally pushed earlier so a
            # protocol-producer failure cannot freeze general freshness. A
            # repository_dispatch, PR merge, or operator run can advance
            # trunk while producers are fetched, so replay and retry without
            # ever force-pushing. Rebase conflicts remain fatal.
            for attempt in 1 2 3; do
              git fetch --quiet origin trunk
              git rebase origin/trunk
              if git push origin HEAD:trunk; then break; fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Could not publish protocol ledger after 3 concurrent-update retries."
                exit 1
              fi
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        run: |
          python3 scripts/build-site.py
          if [ -f data/protocol-certification.v1.json ]; then
            cp data/protocol-certification.v1.json site/data/protocol-certification.v1.json
          fi
          if [ -f data/protocol-certification-summary.v1.json ]; then
            cp data/protocol-certification-summary.v1.json site/data/protocol-certification-summary.v1.json
          fi
          if [ -d data/sha256 ]; then
            mkdir -p site/data/sha256
            cp -R data/sha256/. site/data/sha256/
          fi

      # Offline gate only (structure, internal links, a11y, receipt-walk
      # shape): a third-party outage must not block the daily deploy. The
      # PR gate (validate.yml) runs the same validator with --online, which
      # HTTP-checks every external receipt hop.
      - name: Validate site before deploy
        run: python3 scripts/validate-site.py

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  deploy:
    needs: aggregate
    runs-on: ubuntu-latest
    # The ONLY environment-bound job. If the environment parks it, the ledger
    # above has already been refreshed and committed.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 15
    # cancel-in-progress: TRUE is the deadlock breaker -- a run that can never
    # be approved is superseded by the next one rather than holding the group.
    concurrency:
      group: aggregate-pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
