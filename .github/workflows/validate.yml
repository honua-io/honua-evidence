name: validate

# PR gate for the Phase-B pipeline (honua-io/honua-evidence#1, #2, #3, #8):
# runs the ingestion/freshness unit tests, re-runs the aggregation in --check
# (drift-gate) mode against live producer snapshots, then makes sure the
# static site still builds cleanly from whatever data/capability-matrix.v1.json
# is committed.

on:
  pull_request:
    paths:
      - "scripts/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/aggregate.yml"
      - ".github/workflows/ledger-liveness.yml"
      - ".github/workflows/validate.yml"
  push:
    branches: [trunk]
    paths:
      - "scripts/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/aggregate.yml"
      - ".github/workflows/ledger-liveness.yml"
      - ".github/workflows/validate.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Unit tests (ingestion + freshness computation)
        run: python3 -m unittest discover -s tests -v

      - name: Aggregate drift check
        env:
          HONUA_EVIDENCE_TOKEN: ${{ secrets.HONUA_EVIDENCE_TOKEN }}
        run: python3 scripts/aggregate.py --check

      - name: Build site
        run: python3 scripts/build-site.py

      # Issue #4's generator, smoke-run against the committed matrix: proves
      # a real brief and the proof-counts block render cleanly and pass the
      # buyer-shareable output guard (private-repo names / personal emails
      # abort generation) on every PR that touches scripts/ or data/.
      - name: Generate evidence brief (smoke + buyer-shareable guard)
        run: |
          python3 scripts/generate-brief.py brief --prospect "CI Smoke Prospect" \
            --caps serve.ogc-api-features,editing.featureserver-edits --output - > /dev/null
          python3 scripts/generate-brief.py proof-counts --output - > /dev/null

      # Issue #2's acceptance gate, CI-encoded: internal links + fragments,
      # static a11y pass (lang/title/headings/alt/labels/captions), Pages
      # domain files, and the card -> L2 -> raw-artifact receipt walk for the
      # editing capability with every external hop HTTP-checked (--online).
      - name: Validate site (links, a11y, receipt walk)
        run: python3 scripts/validate-site.py --online
